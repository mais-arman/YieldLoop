openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /v1/materials:
    get:
      operationId: listMaterials
      security: [{sessionCookie: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: search, in: query, schema: {type: string, maxLength: 120}}
      responses:
        "200":
          description: Searchable immutable material definitions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MaterialPage"}
    post:
      operationId: createMaterial
      security: [{sessionCookie: []}]
      description: Manager only; CSRF required. Immutable definitions preserve historical meaning.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MaterialInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Material"}
        "409": {description: Duplicate material identity}
  /v1/jobs/{id}/materials:
    get:
      operationId: getJobMaterials
      security: [{sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200":
          description: Persisted reconciliation and paginated records at a consistent revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MaterialState"}
        "404": {description: Hidden job or page out of range}
  /v1/jobs/{id}/materials/entries:
    post:
      operationId: recordMaterialEntry
      security: [{sessionCookie: []}]
      description: Manager/Supervisor, Open jobs only, CSRF required. All decimal quantities must be strings.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MaterialEntryInput"}
      responses:
        "201":
          description: Entry and reconciliation committed atomically
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MaterialState"}
        "400": {description: "Invalid precision, unit, material, category or first entry"}
        "409": {description: "Stale revision, closed job or duplicate request"}
  /v1/jobs/{id}/materials/entries/{entryId}/void:
    post:
      operationId: voidMaterialEntry
      security: [{sessionCookie: []}]
      description: Manager/Supervisor correction on Open jobs; original record preserved. CSRF required.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: entryId, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MaterialVoidInput"}
      responses:
        "200":
          description: Void and reconciliation committed atomically
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MaterialState"}
        "404": {description: Missing record or cross-job reference}
        "409": {description: "Stale revision, closed job or already voided"}
  /v1/jobs:
    get:
      operationId: listProductionJobs
      security: [{sessionCookie: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: search, in: query, schema: {type: string, maxLength: 120}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/JobStatus"}}
      responses:
        "200":
          description: Role-scoped, newest-first jobs
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobPage"}
        "400": {description: Invalid query}
        "401": {description: Session required}
        "403": {description: Password replacement required}
        "404": {description: Page out of range}
    post:
      operationId: createProductionJob
      security: [{sessionCookie: []}]
      description: Manager only; CSRF required. Server assigns number, creator and Draft status.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JobInput"}
      responses:
        "201":
          description: Persisted job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductionJob"}
        "400": {description: Validation error}
        "403": {description: Forbidden}
  /v1/jobs/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      operationId: getProductionJob
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Job with server-calculated permissions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductionJob"}
        "404": {description: Missing or not visible}
    patch:
      operationId: updateProductionJob
      security: [{sessionCookie: []}]
      description: CSRF required. Revision required to prevent lost updates. Cancelled jobs are immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JobUpdate"}
      responses:
        "200":
          description: Persisted job with incremented revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductionJob"}
        "400": {description: Invalid input or transition}
        "403": {description: Forbidden}
        "404": {description: Missing or not visible}
        "409": {description: Stale revision or cancelled job}
  /v1/auth/csrf:
    get:
      operationId: acquireCsrf
      responses:
        "200":
          description: Masked CSRF token; cookie is HttpOnly
          content:
            application/json:
              schema: {type: object, required: [csrfToken], properties: {csrfToken: {type: string}}}
  /v1/auth/login:
    post:
      operationId: sessionLogin
      description: Requires X-CSRFToken and CSRF cookie; rotates session and CSRF token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [username, password], properties: {username: {type: string}, password: {type: string, writeOnly: true}}}
      responses:
        "200":
          description: Authenticated; session cookie set
          content:
            application/json:
              schema:
                type: object
                required: [user, csrfToken]
                properties:
                  user: {$ref: "#/components/schemas/Employee"}
                  csrfToken: {type: string}
        "401": {description: Invalid credentials or expired temporary password}
        "403": {description: Invalid CSRF}
        "429": {description: Shared rate limit exceeded}
  /v1/auth/me:
    get:
      operationId: currentEmployee
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Safe current identity, including restricted password state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Employee"}
        "401": {description: No valid session}
  /v1/auth/logout:
    post:
      operationId: sessionLogout
      security: [{sessionCookie: []}]
      description: Requires CSRF; flushes the current session.
      responses:
        "200": {description: Logged out}
  /v1/auth/password:
    post:
      operationId: replacePassword
      security: [{sessionCookie: []}]
      description: Requires CSRF; invalidates all sessions and logs out.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [current_password, new_password], properties: {current_password: {type: string, writeOnly: true}, new_password: {type: string, writeOnly: true}}}
      responses:
        "200": {description: Password changed}
        "403": {description: Expired temporary password or invalid CSRF}
  /v1/employees:
    get:
      operationId: listEmployees
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Manager-only employee list
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Employee"}}
    post:
      operationId: addEmployee
      security: [{sessionCookie: []}]
      description: Manager-only; CSRF required; temporary password expires in 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, role, temporary_password]
              properties:
                username: {type: string}
                first_name: {type: string}
                last_name: {type: string}
                role: {$ref: "#/components/schemas/EmployeeRole"}
                temporary_password: {type: string, writeOnly: true}
      responses:
        "201":
          description: Employee created; no password returned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Employee"}
  /v1/employees/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    patch:
      operationId: modifyEmployee
      security: [{sessionCookie: []}]
      description: Manager-only; CSRF required; revokes affected sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: {$ref: "#/components/schemas/EmployeeRole"}
                is_active: {type: boolean}
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Employee"}
  /v1/employees/{id}/password:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      operationId: resetEmployeePassword
      security: [{sessionCookie: []}]
      description: Manager-only; CSRF required; reissues temporary password and revokes sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [temporary_password], properties: {temporary_password: {type: string, writeOnly: true}}}
      responses:
        "200":
          description: Password reset; no password returned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Employee"}
  /v1/health/ready:
    get:
      operationId: databaseReadiness
      tags: [health]
      summary: Check actual PostgreSQL connectivity
      responses:
        "200":
          description: PostgreSQL query succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: PostgreSQL is unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: yieldloop_session}
  schemas:
    MaterialInput:
      type: object
      additionalProperties: false
      required: [name, specification, unit]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        specification: {type: string, minLength: 1, maxLength: 500}
        unit: {type: string, enum: [kg]}
    Material:
      type: object
      required: [id, name, specification, unit, created_at]
      properties:
        id: {type: integer}
        name: {type: string}
        specification: {type: string}
        unit: {type: string, enum: [kg]}
        created_at: {type: string, format: date-time}
    MaterialPage:
      type: object
      required: [count, page, page_size, total_pages, results]
      properties:
        count: {type: integer}
        page: {type: integer}
        page_size: {type: integer}
        total_pages: {type: integer}
        results: {type: array, items: {$ref: "#/components/schemas/Material"}}
    MaterialEntryInput:
      type: object
      additionalProperties: false
      required: [revision, job_revision, material_id, kind, quantity, unit, request_id]
      properties:
        revision: {type: integer, minimum: 0}
        job_revision: {type: integer, minimum: 1}
        material_id: {type: integer, minimum: 1}
        kind: {type: string, enum: [issue, good, scrap, offcut]}
        quantity: {type: string, description: Positive kg decimal with at most 12 integer and 3 fractional digits}
        unit: {type: string, enum: [kg]}
        note: {type: string, maxLength: 1000}
        request_id: {type: string, format: uuid}
    MaterialVoidInput:
      type: object
      additionalProperties: false
      required: [revision, job_revision, reason]
      properties:
        revision: {type: integer, minimum: 0}
        job_revision: {type: integer, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 1000}
    MaterialEntry:
      type: object
      required: [id, material_id, kind, quantity, unit, note, created_at, created_by, void]
      properties:
        id: {type: integer}
        material_id: {type: integer}
        kind: {type: string, enum: [issue, good, scrap, offcut]}
        quantity: {type: string}
        unit: {type: string, enum: [kg]}
        note: {type: string}
        created_at: {type: string, format: date-time}
        created_by:
          type: object
          required: [id, username]
          properties:
            id: {type: integer}
            username: {type: string}
        void:
          type: [object, "null"]
          required: [reason, created_at, created_by]
          properties:
            reason: {type: string}
            created_at: {type: string, format: date-time}
            created_by:
              type: object
              required: [id, username]
              properties:
                id: {type: integer}
                username: {type: string}
    MaterialState:
      type: object
      required: [job_id, job_revision, revision, material, summary, permissions, entries]
      properties:
        job_id: {type: integer}
        job_revision: {type: integer}
        revision: {type: integer}
        material:
          anyOf:
            - {$ref: "#/components/schemas/Material"}
            - {type: "null"}
        summary:
          type: [object, "null"]
          required: [issued, good, scrap, offcut, accounted, variance, yield_rate, scrap_rate, created_at]
          properties:
            issued: {type: string}
            good: {type: string}
            scrap: {type: string}
            offcut: {type: string}
            accounted: {type: string}
            variance: {type: string}
            yield_rate: {type: [string, "null"]}
            scrap_rate: {type: [string, "null"]}
            created_at: {type: string, format: date-time}
        permissions:
          type: object
          required: [record, manage_materials]
          properties:
            record: {type: boolean}
            manage_materials: {type: boolean}
        entries:
          type: object
          required: [count, page, page_size, total_pages, results]
          properties:
            count: {type: integer}
            page: {type: integer}
            page_size: {type: integer}
            total_pages: {type: integer}
            results: {type: array, items: {$ref: "#/components/schemas/MaterialEntry"}}
    JobStatus:
      type: string
      enum: [draft, open, cancelled]
    JobInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        notes: {type: string, maxLength: 5000}
    JobUpdate:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: {type: integer, minimum: 1}
        title: {type: string, minLength: 1, maxLength: 200}
        notes: {type: string, maxLength: 5000}
        status: {$ref: "#/components/schemas/JobStatus"}
    ProductionJob:
      type: object
      required: [id, job_number, title, notes, status, revision, created_by, created_at, updated_at, permissions]
      properties:
        id: {type: integer}
        job_number: {type: string}
        title: {type: string}
        notes: {type: string}
        status: {$ref: "#/components/schemas/JobStatus"}
        revision: {type: integer}
        created_by:
          type: object
          required: [id, username]
          properties:
            id: {type: integer}
            username: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        permissions:
          type: object
          required: [edit_title, edit_notes, transitions]
          properties:
            edit_title: {type: boolean}
            edit_notes: {type: boolean}
            transitions: {type: array, items: {$ref: "#/components/schemas/JobStatus"}}
    JobPage:
      type: object
      required: [count, page, page_size, total_pages, results]
      properties:
        count: {type: integer}
        page: {type: integer}
        page_size: {type: integer}
        total_pages: {type: integer}
        results: {type: array, items: {$ref: "#/components/schemas/ProductionJob"}}
    EmployeeRole:
      type: string
      enum: [cutting_operator, production_supervisor, manager]
    Employee:
      type: object
      required: [id, username, first_name, last_name, role, is_active, must_change_password, temporary_password_expired]
      properties:
        id: {type: integer}
        username: {type: string}
        first_name: {type: string}
        last_name: {type: string}
        role: {$ref: "#/components/schemas/EmployeeRole"}
        is_active: {type: boolean}
        must_change_password: {type: boolean}
        temporary_password_expired: {type: boolean}
    ReadinessStatus:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        database:
          type: string
          enum: [connected, unavailable]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

