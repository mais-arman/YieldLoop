openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /v1/assistance/status:
    get:
      operationId: getAssistanceStatus
      responses:
        "200":
          description: Configuration presence, not a provider availability guarantee
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssistanceStatus"}
  /v1/jobs/{job_id}/assistance/evidence:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: integer}}
    get:
      operationId: getAssistanceEvidence
      responses:
        "200":
          description: Authorized coherent recorded evidence, not an AI response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssistanceEvidence"}
  /v1/jobs/{job_id}/assistance:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: integer}}
    post:
      operationId: analyzeJobEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AssistanceInput"}
      responses:
        "200":
          description: Read-only advisory response, model-selected validated leads, server-owned facts and calculations
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssistanceAnswer"}
        "503": {description: AI credentials unavailable}
        "502": {description: Provider error or rejected malformed output}
        "404": {description: Job missing or not visible}
        "409": {description: Source revisions changed during generation}
  /v1/packaging/templates:
    get:
      operationId: getPackagingTemplates
      responses:
        "200":
          description: Supported visual concepts and parameter bounds
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PackagingCatalogue"}
  /v1/packaging/validate:
    post:
      operationId: validatePackagingConcept
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PackagingDesign"}
      responses:
        "200":
          description: Valid concept parameters, never a manufacturing certification
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PackagingValidation"}
        "400": {description: Invalid or unsupported parameters}
  /v1/packaging/propose:
    post:
      operationId: proposePackagingConcept
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PackagingPrompt"}
      responses:
        "200":
          description: Review-required complete or partial proposal
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PackagingProposal"}
        "503": {description: AI credentials unavailable}
        "502": {description: Provider error or rejected malformed proposal}
  /v1/jobs/{job_id}/cutting:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: integer}}
    get:
      operationId: listCuttingPlans
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200":
          description: Job-scoped saved proposals
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CuttingPlanPage"}
    post:
      operationId: createCuttingPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CuttingSaveInput"}
      responses:
        "201":
          description: Saved with atomic immutable audit revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CuttingPlan"}
        "400": {description: Invalid inputs or geometry}
        "403": {description: Editing not permitted}
        "409": {description: "Duplicate request, stale revision or closed job"}
  /v1/jobs/{job_id}/cutting/evaluate:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: integer}}
    post:
      operationId: evaluateCuttingScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scenario, generate]
              properties:
                scenario: {$ref: "#/components/schemas/CuttingScenarioInput"}
                generate: {type: boolean}
      responses:
        "200":
          description: Validated scenario, or deterministic shelf-v1 proposal; not persisted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CuttingScenario"}
        "400": {description: "Invalid dimensions, spacing, rotation or constraints"}
        "403": {description: Editing not permitted}
        "409": {description: Job closed}
  /v1/jobs/{job_id}/cutting/{id}:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: integer}}
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      operationId: getCuttingPlan
      responses:
        "200":
          description: Current proposal; read-only for Operator and cancelled source
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CuttingPlan"}
        "404": {description: Missing or hidden job/plan}
    put:
      operationId: updateCuttingPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CuttingSaveInput"}
      responses:
        "200":
          description: New audited revision without changing production or inventory
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CuttingPlan"}
        "400": {description: Invalid geometry or required reason}
        "403": {description: Editing not permitted}
        "409": {description: "Stale revision, duplicate request or closed job"}
  /v1/jobs/{job_id}/cutting/{id}/history:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: integer}}
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      operationId: getCuttingHistory
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200":
          description: Paginated immutable revision inputs, results, actor and reason
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CuttingHistoryPage"}
  /v1/reports/overview:
    get:
      operationId: getReportOverview
      parameters:
        - {name: start_date, in: query, schema: {type: string, format: date}}
        - {name: end_date, in: query, schema: {type: string, format: date}}
        - {name: timezone, in: query, schema: {type: string, enum: [UTC, Asia/Jerusalem]}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/JobStatus"}}
        - {name: material_id, in: query, schema: {type: integer}}
        - {name: job_page, in: query, schema: {type: integer}}
        - {name: lot_page, in: query, schema: {type: integer}}
        - {name: page_size, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Current balances for jobs created in the selected dates, scoped by role. Never historical flows.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportOverview"}
        "400": {description: Invalid filters}
        "401": {description: Authentication required}
        "403": {description: Password change required}
        "404": {description: Hidden material or out-of-range page}
  /v1/inventory:
    get:
      operationId: listInventory
      parameters:
        - {name: page, in: query, schema: {type: integer}}
        - {name: page_size, in: query, schema: {type: integer}}
        - {name: search, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string, enum: [available, voided]}}
        - {name: job_id, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Role scoped inventory
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InventoryPage"}
    post:
      operationId: registerOffcut
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InventoryInput"}
      responses:
        "201":
          description: Registered whole output
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InventoryLot"}
  /v1/inventory/{id}:
    get:
      operationId: getInventoryLot
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Lot and bounded append only history
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InventoryLot"}
  /v1/inventory/{id}/void:
    post:
      operationId: voidInventoryLot
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InventoryVoidInput"}
      responses:
        "200":
          description: Voided without changing reconciliation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InventoryLot"}
  /v1/inventory/{id}/{action}:
    post:
      operationId: blockedInventoryReuse
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: action, in: path, required: true, schema: {type: string, enum: [reserve, release, consume]}}
      responses:
        "409": {description: Reuse policy required; no mutation allowed}
  /v1/materials:
    get:
      operationId: listMaterials
      security: [{sessionCookie: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: search, in: query, schema: {type: string, maxLength: 120}}
      responses:
        "200":
          description: Searchable immutable material definitions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MaterialPage"}
    post:
      operationId: createMaterial
      security: [{sessionCookie: []}]
      description: Manager only; CSRF required. Immutable definitions preserve historical meaning.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MaterialInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Material"}
        "409": {description: Duplicate material identity}
  /v1/jobs/{id}/materials:
    get:
      operationId: getJobMaterials
      security: [{sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200":
          description: Persisted reconciliation and paginated records at a consistent revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MaterialState"}
        "404": {description: Hidden job or page out of range}
  /v1/jobs/{id}/materials/entries:
    post:
      operationId: recordMaterialEntry
      security: [{sessionCookie: []}]
      description: Manager/Supervisor, Open jobs only, CSRF required. All decimal quantities must be strings.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MaterialEntryInput"}
      responses:
        "201":
          description: Entry and reconciliation committed atomically
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MaterialState"}
        "400": {description: "Invalid precision, unit, material, category or first entry"}
        "409": {description: "Stale revision, closed job or duplicate request"}
  /v1/jobs/{id}/materials/entries/{entryId}/void:
    post:
      operationId: voidMaterialEntry
      security: [{sessionCookie: []}]
      description: Manager/Supervisor correction on Open jobs; original record preserved. CSRF required.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: entryId, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MaterialVoidInput"}
      responses:
        "200":
          description: Void and reconciliation committed atomically
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MaterialState"}
        "404": {description: Missing record or cross-job reference}
        "409": {description: "Stale revision, closed job or already voided"}
  /v1/jobs:
    get:
      operationId: listProductionJobs
      security: [{sessionCookie: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: search, in: query, schema: {type: string, maxLength: 120}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/JobStatus"}}
      responses:
        "200":
          description: Role-scoped, newest-first jobs
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobPage"}
        "400": {description: Invalid query}
        "401": {description: Session required}
        "403": {description: Password replacement required}
        "404": {description: Page out of range}
    post:
      operationId: createProductionJob
      security: [{sessionCookie: []}]
      description: Manager only; CSRF required. Server assigns number, creator and Draft status.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JobInput"}
      responses:
        "201":
          description: Persisted job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductionJob"}
        "400": {description: Validation error}
        "403": {description: Forbidden}
  /v1/jobs/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      operationId: getProductionJob
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Job with server-calculated permissions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductionJob"}
        "404": {description: Missing or not visible}
    patch:
      operationId: updateProductionJob
      security: [{sessionCookie: []}]
      description: CSRF required. Revision required to prevent lost updates. Cancelled jobs are immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JobUpdate"}
      responses:
        "200":
          description: Persisted job with incremented revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductionJob"}
        "400": {description: Invalid input or transition}
        "403": {description: Forbidden}
        "404": {description: Missing or not visible}
        "409": {description: Stale revision or cancelled job}
  /v1/auth/csrf:
    get:
      operationId: acquireCsrf
      responses:
        "200":
          description: Masked CSRF token; cookie is HttpOnly
          content:
            application/json:
              schema: {type: object, required: [csrfToken], properties: {csrfToken: {type: string}}}
  /v1/auth/login:
    post:
      operationId: sessionLogin
      description: Requires X-CSRFToken and CSRF cookie; rotates session and CSRF token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [username, password], properties: {username: {type: string}, password: {type: string, writeOnly: true}}}
      responses:
        "200":
          description: Authenticated; session cookie set
          content:
            application/json:
              schema:
                type: object
                required: [user, csrfToken]
                properties:
                  user: {$ref: "#/components/schemas/Employee"}
                  csrfToken: {type: string}
        "401": {description: Invalid credentials or expired temporary password}
        "403": {description: Invalid CSRF}
        "429": {description: Shared rate limit exceeded}
  /v1/auth/me:
    get:
      operationId: currentEmployee
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Safe current identity, including restricted password state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Employee"}
        "401": {description: No valid session}
  /v1/auth/logout:
    post:
      operationId: sessionLogout
      security: [{sessionCookie: []}]
      description: Requires CSRF; flushes the current session.
      responses:
        "200": {description: Logged out}
  /v1/auth/password:
    post:
      operationId: replacePassword
      security: [{sessionCookie: []}]
      description: Requires CSRF; invalidates all sessions and logs out.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [current_password, new_password], properties: {current_password: {type: string, writeOnly: true}, new_password: {type: string, writeOnly: true}}}
      responses:
        "200": {description: Password changed}
        "403": {description: Expired temporary password or invalid CSRF}
  /v1/employees:
    get:
      operationId: listEmployees
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Manager-only employee list
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Employee"}}
    post:
      operationId: addEmployee
      security: [{sessionCookie: []}]
      description: Manager-only; CSRF required; temporary password expires in 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, role, temporary_password]
              properties:
                username: {type: string}
                first_name: {type: string}
                last_name: {type: string}
                role: {$ref: "#/components/schemas/EmployeeRole"}
                temporary_password: {type: string, writeOnly: true}
      responses:
        "201":
          description: Employee created; no password returned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Employee"}
  /v1/employees/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    patch:
      operationId: modifyEmployee
      security: [{sessionCookie: []}]
      description: Manager-only; CSRF required; revokes affected sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: {$ref: "#/components/schemas/EmployeeRole"}
                is_active: {type: boolean}
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Employee"}
  /v1/employees/{id}/password:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      operationId: resetEmployeePassword
      security: [{sessionCookie: []}]
      description: Manager-only; CSRF required; reissues temporary password and revokes sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [temporary_password], properties: {temporary_password: {type: string, writeOnly: true}}}
      responses:
        "200":
          description: Password reset; no password returned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Employee"}
  /v1/health/ready:
    get:
      operationId: databaseReadiness
      tags: [health]
      summary: Check actual PostgreSQL connectivity
      responses:
        "200":
          description: PostgreSQL query succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: PostgreSQL is unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: yieldloop_session}
  schemas:
    AssistanceStatus:
      type: object
      required: [available, provider, model]
      properties:
        available: {type: boolean}
        provider: {type: string, enum: [openai]}
        model: {type: [string, "null"]}
    AssistanceInput:
      type: object
      additionalProperties: false
      required: [language, question]
      properties:
        language: {type: string, enum: [en, ar]}
        question: {type: string, minLength: 1, maxLength: 2000}
        include_notes: {type: boolean, default: false}
    EvidenceFact:
      type: object
      required: [id, kind, quantity, unit, created_at, voided]
      properties:
        id: {type: string}
        kind: {type: string}
        quantity: {type: string}
        unit: {type: string}
        created_at: {type: string}
        voided: {type: boolean}
        note: {type: string}
    EvidenceJob:
      type: object
      required: [id, job_number, status, revision]
      properties:
        id: {type: integer}
        job_number: {type: string}
        status: {type: string}
        revision: {type: integer}
    EvidenceCuttingPlan:
      type: object
      required: [plan_id, revision, name, scenarios]
      properties:
        plan_id: {type: integer}
        revision: {type: integer}
        name: {type: string}
        scenarios: {type: array, items: {$ref: "#/components/schemas/CuttingScenario"}}
    AssistanceEvidence:
      type: object
      required: [job, material_revision, generated_at, recorded_facts, calculated_findings, cutting, limitations]
      properties:
        job: {$ref: "#/components/schemas/EvidenceJob"}
        material_revision: {type: integer}
        generated_at: {type: string}
        recorded_facts: {type: array, items: {$ref: "#/components/schemas/EvidenceFact"}}
        calculated_findings: {type: [object, "null"], additionalProperties: {type: [string, "null"]}}
        cutting: {type: array, items: {$ref: "#/components/schemas/EvidenceCuttingPlan"}}
        limitations: {type: array, items: {type: string}}
    AssistanceLead:
      type: object
      required: [code, record_ids, text, evidence_needed, next_step]
      properties:
        code: {type: string}
        record_ids: {type: array, items: {type: string}}
        text: {type: string}
        evidence_needed: {type: string}
        next_step: {type: string}
    AssistanceAnswer:
      type: object
      required: [evidence, advisory, language, answer, possible_leads, notice]
      properties:
        evidence: {$ref: "#/components/schemas/AssistanceEvidence"}
        advisory: {type: boolean, const: true}
        language: {type: string, enum: [en, ar]}
        answer: {type: array, items: {type: string}}
        possible_leads: {type: array, items: {$ref: "#/components/schemas/AssistanceLead"}}
        notice: {type: string}
    PackagingDesign:
      type: object
      additionalProperties: false
      required: [template, name, parameters, state]
      properties:
        template: {type: string, enum: [tray, sleeve, lid_box]}
        name: {type: string, minLength: 1, maxLength: 160}
        parameters: {type: object, additionalProperties: {type: string}}
        state: {type: string, enum: [assembled, open]}
    PackagingValidation:
      type: object
      required: [valid, design, production_validated]
      properties:
        valid: {type: boolean, const: true}
        design: {$ref: "#/components/schemas/PackagingDesign"}
        production_validated: {type: boolean, const: false}
    PackagingPrompt:
      type: object
      additionalProperties: false
      required: [language, description]
      properties:
        language: {type: string, enum: [en, ar]}
        description: {type: string, minLength: 1, maxLength: 2000}
    PackagingProposal:
      type: object
      required: [template, name, parameters, missing, assumptions, valid, production_validated]
      properties:
        template: {type: [string, "null"], enum: [tray, sleeve, lid_box, null]}
        name: {type: string}
        parameters: {type: object, additionalProperties: {type: string}}
        missing: {type: array, items: {type: string}}
        assumptions: {type: array, items: {type: string}}
        valid: {type: boolean}
        production_validated: {type: boolean, const: false}
    PackagingLabel:
      type: object
      required: [en, ar]
      properties:
        en: {type: string}
        ar: {type: string}
    PackagingParameter:
      type: object
      required: [key, label, min, max, required]
      properties:
        key: {type: string}
        label: {$ref: "#/components/schemas/PackagingLabel"}
        min: {type: number}
        max: {type: number}
        required: {type: boolean}
    PackagingTemplate:
      type: object
      required: [id, label, parameters, states, unit, dimension_basis, production_validated]
      properties:
        id: {type: string, enum: [tray, sleeve, lid_box]}
        label: {$ref: "#/components/schemas/PackagingLabel"}
        parameters: {type: array, items: {$ref: "#/components/schemas/PackagingParameter"}}
        states: {type: array, items: {type: string, enum: [assembled, open]}}
        unit: {type: string, enum: [mm]}
        dimension_basis: {type: string, enum: [internal]}
        production_validated: {type: boolean, const: false}
    PackagingCatalogue:
