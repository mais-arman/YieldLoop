openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /v1/health/ready:
    get:
      operationId: databaseReadiness
      tags: [health]
      summary: Check actual PostgreSQL connectivity
      responses:
        "200":
          description: PostgreSQL query succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: PostgreSQL is unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    ReadinessStatus:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        database:
          type: string
          enum: [connected, unavailable]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

