server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # This development Compose gateway is HTTP only.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
