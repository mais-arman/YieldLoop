# Optional HTTP-only local verification setup; PostgreSQL is externally supplied.
# Not a production TLS deployment. No database creation or migrations.
services:
  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment:
      PORT: "8080"
      DJANGO_ENV: development
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: ${DATABASE_URL:?Supply PostgreSQL through your environment}
  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - backend
